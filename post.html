<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Post — Your Name</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-grid"></div>
<div class="glow a"></div>
<div class="glow b"></div>
<div id="cursor"></div>

<div class="subnav">
  <a class="brand" href="index.html">YOURNAME</a>
  <div class="nav-links">
    <a href="index.html#work">WORK</a>
    <a href="index.html#experience">EXPERIENCE</a>
    <a href="blog.html">WRITING</a>
    <a href="index.html#contact">CONTACT</a>
  </div>
</div>

<section class="article">
  <div class="wrap narrow" style="padding-top:130px">
    <a class="back-link" href="blog.html">← ALL WRITING</a>
    <div id="article"></div>
  </div>
</section>

<footer class="wrap narrow" style="border:none;margin-top:40px">
  <span>© 2026 YOUR NAME</span>
  <span><a href="blog.html">← BACK TO WRITING</a></span>
</footer>

<script src="posts.js"></script>
<script>
  var cur=document.getElementById('cursor');
  window.addEventListener('mousemove',function(e){cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});

  function fmt(d){
    var p=d.split('-');var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return m[parseInt(p[1],10)-1]+" "+parseInt(p[2],10)+", "+p[0];
  }
  function qid(){
    var m=location.search.match(/[?&]id=([^&]+)/);return m?decodeURIComponent(m[1]):null;
  }
  var id=qid();
  var post=(window.POSTS||[]).find(function(p){return p.slug===id;});
  var el=document.getElementById('article');
  if(!post){
    el.innerHTML='<div class="empty">Post not found. <a href="blog.html" style="color:var(--accent-2)">Go back to writing →</a></div>';
  } else {
    document.title=post.title+' — Your Name';
    el.innerHTML=
      '<div class="article-meta">'+(post.category?'<span style="color:var(--accent)">'+post.category+'</span>':'')+
        '<span>'+fmt(post.date)+'</span>'+
        (post.tags||[]).map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>'+
      '<h1>'+post.title+'</h1>'+
      '<div class="prose">'+post.body+'</div>';
  }
  document.querySelectorAll('a').forEach(function(elx){
    elx.addEventListener('mouseenter',function(){cur.style.transform='translate(-50%,-50%) scale(3.2)';cur.style.opacity='.5';});
    elx.addEventListener('mouseleave',function(){cur.style.transform='translate(-50%,-50%) scale(1)';cur.style.opacity='1';});
  });
</script>
</body>
</html>
